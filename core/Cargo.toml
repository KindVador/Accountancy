[package]
name = "accountancy-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Accountancy business-rule core: entities, SQLite persistence. No UI dependency."

[lib]
name = "accountancy_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# Backup archive format (core::backup). Deflate only - no need for the
# encryption or AES feature sets.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Attachment checksums (core::attachments) - pure Rust, no C dependency.
sha2 = "0.10"
# Attachment internal filenames (core::attachments): a real GUID, not a
# name derived from the original file.
uuid = { version = "1", features = ["v4"] }
# Printing (core::printing): a pure-Rust PDF renderer (its own HTML/CSS
# layout engine, not the system webview), so a printed statement looks the
# same on every platform. See docs/architecture.md.
printpdf = "0.12"
# Excel/OpenDocument statement import (core::import::excel) - pure Rust.
calamine = "0.36"

[dev-dependencies]
tempfile = "3"
# Only to build a test fixture .xlsx for core::import::excel's tests -
# calamine itself is read-only.
rust_xlsxwriter = "0.98"
